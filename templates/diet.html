<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VitaCore AI | AI Diet Planner</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Diet CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/diet.css') }}">

</head>

<body>

<div class="diet-container">

    <!-- ================= HEADER ================= -->

    <div class="diet-header">

        <div>

            <h1>

                🥗 AI Diet Planner

            </h1>

            <p>

                Personalized nutrition powered by Gemini AI.

            </p>

        </div>

        <a href="/dashboard"
           class="btn btn-primary">

            <i class="bi bi-arrow-left"></i>

            Dashboard

        </a>

    </div>

    <!-- ================= USER SUMMARY ================= -->

    <div class="summary-card">

        <div class="summary-item">

            <i class="bi bi-person-circle"></i>

            <div>

                <h5>Name</h5>

                <span>{{ user.name }}</span>

            </div>

        </div>

        <div class="summary-item">

            <i class="bi bi-bullseye"></i>

            <div>

                <h5>Goal</h5>

                <span>{{ user.goal }}</span>

            </div>

        </div>

        <div class="summary-item">

            <i class="bi bi-heart-pulse-fill"></i>

            <div>

                <h5>Health</h5>

                <span>AI Personalized Plan</span>

            </div>

        </div>

    </div>

    <!-- ================= AI PLAN ================= -->

    <div class="diet-card">

        <div class="diet-title">

            <i class="bi bi-stars"></i>

            AI Generated Diet Plan

        </div>

        <div class="diet-content">

    <div class="diet-text">

        {{ diet_plan | replace('\n', '<br>') | safe }}

    </div>

</div>

    </div>

    <!-- ================= BUTTONS ================= -->

    <div class="button-group">

        <a href="/diet"
           class="btn btn-success">

            <i class="bi bi-arrow-repeat"></i>

            Generate New Plan

        </a>
    </div>

</div>

<script src="{{ url_for('static', filename='js/diet.js') }}"></script>

</body>

</html>
