<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VitaCore AI| Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="background-image">

    <img src="{{ url_for('static', filename='images/athlete.png') }}">

</div>

<div class="overlay"></div>

<div class="login-wrapper">

<div class="login-card">

<div class="logo">

<div class="logo-circle">

<i class="bi bi-key-fill"></i>

</div>

<h2>Forgot Password</h2>

<p>Reset your VitaCore AI password</p>

</div>

{% with messages = get_flashed_messages() %}
{% if messages %}

{% for message in messages %}

<div class="alert alert-warning">

{{ message }}

</div>

{% endfor %}

{% endif %}
{% endwith %}

<form method="POST">

<div class="input-box">

<i class="bi bi-envelope-fill"></i>

<input
type="email"
name="email"
placeholder="Registered Email"
required>

</div>

<div class="input-box">

<i class="bi bi-lock-fill"></i>

<input
id="newPassword"
type="password"
name="password"
placeholder="New Password"
required>

<button
        type="button"
        class="eye-btn"
        onclick="toggleNewPassword()">

        <i id="newEyeIcon"
           class="bi bi-eye-slash-fill"></i>

    </button>

</div>

<div class="input-box">

<i class="bi bi-lock-fill"></i>

<input
id="confirmPassword"
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

 <button
        type="button"
        class="eye-btn"
        onclick="toggleConfirmPassword()">

        <i id="confirmEyeIcon"
           class="bi bi-eye-slash-fill"></i>

    </button>

</div>

<button
type="submit"
class="login-btn">

<i class="bi bi-arrow-repeat"></i>

Reset Password

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<a
href="{{ url_for('login') }}"
class="register-btn">

<i class="bi bi-box-arrow-in-left"></i>

Back to Login

</a>

</div>

</div>
<script>

function toggleNewPassword(){

    const password=document.getElementById("newPassword");
    const eye=document.getElementById("newEyeIcon");

    if(password.type==="password"){

        password.type="text";

        eye.classList.remove("bi-eye-slash-fill");
        eye.classList.add("bi-eye-fill");

    }

    else{

        password.type="password";

        eye.classList.remove("bi-eye-fill");
        eye.classList.add("bi-eye-slash-fill");

    }

}

function toggleConfirmPassword(){

    const password=document.getElementById("confirmPassword");
    const eye=document.getElementById("confirmEyeIcon");

    if(password.type==="password"){

        password.type="text";

        eye.classList.remove("bi-eye-slash-fill");
        eye.classList.add("bi-eye-fill");

    }

    else{

        password.type="password";

        eye.classList.remove("bi-eye-fill");
        eye.classList.add("bi-eye-slash-fill");

    }

}

</script>

</body>
</html>
